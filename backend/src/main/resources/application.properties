spring.application.name=smart-campus-api

# Load local environment variables file when present.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL database configuration.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate defaults for local development.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Open-in-view to prevent performance bottleneck
spring.jpa.open-in-view=false

# JWT configuration.
jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-secret-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Auth diagnostics.
app.auth.debug=${AUTH_DEBUG:false}
app.oauth2.redirect-uri=${FRONTEND_OAUTH_CALLBACK_URL:http://localhost:5173/oauth2/callback}
app.auth.verification-code-ttl-minutes=${AUTH_VERIFICATION_CODE_TTL_MINUTES:10}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@smartcampus.local}}

# SMTP mail configuration.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

# Google OAuth2 client configuration.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
